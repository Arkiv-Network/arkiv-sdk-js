name: Tests

on:
  push:
    branches: [main, master, develop]
    # A pushed v* tag runs the full pipeline and publishes to npm under the dist-tag named by the
    # version's prerelease id (v0.8.0-advanced.1 -> @advanced). Path filters below don't apply to
    # tag pushes.
    tags: ["v*"]
    paths-ignore:
      - "*.md"
      - ".github/**"
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - "*.md"
      - ".github/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint

  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test:unit

  smoke-tests:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build package for tests
        run: bun run package:test

      - name: Install test dependencies
        run: cd test && bun install

      - name: Run smoke tests
        run: cd test && bun run test:smoke

  component-tests:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build package for tests
        run: bun run package:test

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkiv-package
          path: arkiv-network-sdk-latest.tgz
          retention-days: 30

      - name: Install test dependencies
        run: cd test && bun install

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Pull Arkiv Docker image
        run: docker pull ghcr.io/arkiv-network/arkiv-reth-dev:latest

      # Using a test private key (randomly generated for testing purposes only)
      - name: Run component tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
          PRIVATE_KEY: "0x049f4de101c81033ab95e057fa3535c131b1da022a1922cd175cf6b63d263892"
        run: cd test && bun run test:component

  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    needs: [component-tests, smoke-tests]
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ARKIV_APP_AUTOMATOR_ID }}
          private-key: ${{ secrets.ARKIV_APP_AUTOMATOR_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check npm version
        run: npm --version

      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@golem.network"

      - name: Version package prerelease
        if: github.ref == 'refs/heads/develop'
        run: bun run version:prerelease

      - name: Version package release
        if: github.ref == 'refs/heads/main'
        run: bun run version:release

      # The tag names the version verbatim; nothing is committed back, the tag already exists.
      - name: Version package from tag
        if: github.ref_type == 'tag'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Prepare package for publish
        run: |
          echo "=== Preparing package for publish ==="
          bun prepublishOnly

      - name: Run publish to dev
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "=== Publishing package ==="
          # Capture both stdout and stderr
          git status -s
          if ! bun run publish-dev 2>&1; then
            echo "=== PUBLISH FAILED ==="
            echo "Exit code: $?"
            echo "=== Full output (stdout + stderr) ==="
            exit 1
          fi

      - name: Run publish to main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "=== Publishing package ==="
          # Capture both stdout and stderr
          if ! bun run publish-main 2>&1; then
            echo "=== PUBLISH FAILED ==="
            echo "Exit code: $?"
            echo "=== Full output (stdout + stderr) ==="
            exit 1
          fi

      - name: Run publish for tag
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The prerelease id is the npm dist-tag: v0.8.0-advanced.1 -> @advanced. 'dev' and
          # 'latest' stay reserved for the develop/main pipelines, and a bare release version has
          # no id at all — refuse rather than touch the default install channel from a hand tag.
          dist_tag="$(echo "$version" | sed -n 's/^[0-9][0-9.]*-\([a-zA-Z][a-zA-Z0-9]*\).*$/\1/p')"
          if [ -z "$dist_tag" ] || [ "$dist_tag" = "dev" ] || [ "$dist_tag" = "latest" ]; then
            echo "Tag $GITHUB_REF_NAME needs a prerelease id to use as the npm dist-tag (e.g. v0.8.0-advanced.1 publishes as @advanced); 'dev' and 'latest' are reserved for the branch pipelines."
            exit 1
          fi
          echo "=== Publishing $version under dist-tag '$dist_tag' ==="
          npm publish ./arkiv-network-sdk-latest.tgz --access public --tag "$dist_tag"

      - name: Push changes
        # Branch runs push their version-bump commit and the tag it created; a tag run has
        # nothing to push — the tag is what triggered it.
        if: github.ref_type == 'branch'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.ref }}
          tags: true
        
      - name: Get latest tag
        id: get_latest_tag
        run: |
          # A tag run releases the tag that triggered it, not whatever tag is newest.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Fetch tags from remote to ensure we have the latest
          git fetch --tags
          # Get the latest tag (with 'v' prefix)
          latest_tag=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "")
          if [ -z "$latest_tag" ]; then
            # Fallback: get tag from package.json version
            version=$(node -p "require('./package.json').version")
            latest_tag="v$version"
          fi
          # Remove 'v' prefix for NPM URL
          version=${latest_tag#v}
          echo "Latest tag: $latest_tag"
          echo "Version: $version"
          echo "tag_name=$latest_tag" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create github release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_latest_tag.outputs.tag_name }}
          body: |
            ## NPM Release
            https://www.npmjs.com/package/@arkiv-network/sdk/v/${{ steps.get_latest_tag.outputs.version }}
          draft: ${{ github.ref == 'refs/heads/develop' }}
          prerelease: ${{ github.ref_type == 'tag' }}

      - name: Trigger docs stage deploy
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: gh workflow run deploy-stage.yml --repo Arkiv-Network/arkiv-starlight-docs --ref develop

      - name: Trigger docs prod deploy
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: gh workflow run deploy-prod.yml --repo Arkiv-Network/arkiv-starlight-docs --ref main
